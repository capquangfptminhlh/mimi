name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production JavaScript
        run: |
          node --check public/lumi-booking.js
          node --check public/lumi-ui.js
          node --check public/lumi-blog.js

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify SEO launch files
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/lumi-ui.js
          test -f dist/lumi-blog.js
          test -f dist/lumi-blog.css
          test -f dist/dat-lich/index.html
          test -f dist/dat-phong/index.html
          test -f dist/spa-thu-cung-binh-thanh/index.html
          test -f dist/grooming-cho-meo-binh-thanh/index.html
          test -f dist/khach-san-thu-cung-binh-thanh/index.html
          test -f dist/bang-gia-spa-thu-cung/index.html
          test -f dist/gioi-thieu/index.html
          test -f dist/lien-he/index.html
          test -f dist/bai-viet/index.html
          test -f dist/bai-viet/spa-cho-binh-thanh-gia-bao-nhieu/index.html
          test -f dist/bai-viet/khach-san-thu-cung-binh-thanh-gia-bao-nhieu/index.html
          test -f dist/bai-viet/grooming-poodle-binh-thanh/index.html
          test -f dist/bai-viet/bao-lau-nen-tam-cho-mot-lan/index.html
          test -f dist/bai-viet/cham-soc-long-poodle-khong-bi-roi/index.html
          test -f dist/bai-viet/meo-co-nen-tam-thuong-xuyen-khong/index.html
          test -f dist/bai-viet/chuan-bi-truoc-khi-gui-cho-meo-khach-san-thu-cung/index.html
          test -f dist/bai-viet/dau-hieu-cho-can-grooming/index.html
          grep -q 'rel="canonical"' dist/index.html

      - name: Verify SEO article quality gates
        run: |
          grep -q 'bai-viet/' dist/sitemap.xml
          grep -q 'spa-cho-binh-thanh-gia-bao-nhieu' dist/sitemap.xml
          grep -q 'khach-san-thu-cung-binh-thanh-gia-bao-nhieu' dist/sitemap.xml
          grep -q 'grooming-poodle-binh-thanh' dist/sitemap.xml
          grep -q 'bao-lau-nen-tam-cho-mot-lan' dist/sitemap.xml
          grep -q 'cham-soc-long-poodle-khong-bi-roi' dist/sitemap.xml
          grep -q 'meo-co-nen-tam-thuong-xuyen-khong' dist/sitemap.xml
          grep -q 'chuan-bi-truoc-khi-gui-cho-meo-khach-san-thu-cung' dist/sitemap.xml
          grep -q 'dau-hieu-cho-can-grooming' dist/sitemap.xml
          for file in dist/bai-viet/*/index.html; do
            grep -q '"@type":"Article"' "$file"
            grep -q 'rel="canonical"' "$file"
            grep -q 'article-hero' "$file"
            grep -q 'blog-cta' "$file"
            grep -q 'lumi-ui.js' "$file"
          done
          grep -q 'Kiến thức chăm sóc chó mèo' dist/bai-viet/index.html
          grep -q 'lumi-blog.js' dist/lumi-ui.js

      - name: Verify production UI gates
        run: |
          grep -R -q '27 Võ Trường Toản' dist/assets
          grep -R -q 'Spa từ 120.000đ' dist/assets
          grep -R -q 'Hotel từ 100.000đ' dist/assets
          grep -R -q 'zalo.me/0989979675' dist
          grep -q 'lumi-ui.js' dist/index.html
          grep -q 'lumi-ui.js' dist/dat-lich/index.html
          grep -q 'lumi-ui.js' dist/dat-phong/index.html
          grep -q 'lumi-ui.js' dist/spa-thu-cung-binh-thanh/index.html
          grep -q 'lumi-ui.js' dist/grooming-cho-meo-binh-thanh/index.html
          grep -q 'lumi-ui.js' dist/khach-san-thu-cung-binh-thanh/index.html
          grep -q 'lumi-ui.js' dist/bang-gia-spa-thu-cung/index.html
          grep -q 'lumi-ui.js' dist/gioi-thieu/index.html
          grep -q 'lumi-ui.js' dist/lien-he/index.html
          grep -q 'lumi-paw-loader' dist/lumi-ui.js
          grep -q 'lumi-contact-zalo' dist/lumi-ui.js
          grep -q 'lumi-hero-visual' dist/lumi-ui.js
          grep -q 'photos/6131161/pexels-photo-6131161.jpeg' dist/lumi-ui.js
          grep -q 'photos/6816844/pexels-photo-6816844.jpeg' dist/lumi-ui.js
          grep -q 'photos/7635904/pexels-photo-7635904.jpeg' dist/lumi-ui.js
          if grep -q 'booking-bridge.js' dist/index.html; then
            echo 'Legacy booking bridge must not ship in production.'
            exit 1
          fi
          if grep -R -E -q 'Penthouse Hoàng Gia|Chủ Cửa Hàng|Đại siêu thị trực tuyến|Khai trương chi nhánh sang chảnh mới' dist/assets; then
            echo 'Unverified legacy demo content detected in production bundle.'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
