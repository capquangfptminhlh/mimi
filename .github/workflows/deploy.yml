name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate booking JavaScript
        run: node --check public/lumi-booking.js

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify SEO launch files
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/dat-lich/index.html
          test -f dist/dat-phong/index.html
          test -f dist/spa-thu-cung-binh-thanh/index.html
          test -f dist/grooming-cho-meo-binh-thanh/index.html
          test -f dist/khach-san-thu-cung-binh-thanh/index.html
          test -f dist/bang-gia-spa-thu-cung/index.html
          grep -q 'rel="canonical"' dist/index.html

      - name: Verify production homepage facts
        run: |
          grep -R -q '27 Võ Trường Toản' dist/assets
          grep -R -q 'Spa từ 120.000đ' dist/assets
          grep -R -q 'Hotel từ 100.000đ' dist/assets
          if grep -q 'booking-bridge.js' dist/index.html; then
            echo 'Legacy booking bridge must not ship in production.'
            exit 1
          fi
          if grep -R -E -q 'Penthouse Hoàng Gia|Chủ Cửa Hàng|Đại siêu thị trực tuyến|Khai trương chi nhánh sang chảnh mới' dist/assets; then
            echo 'Unverified legacy demo content detected in production bundle.'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
