name: Deploy Lumi Pet to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lumipet-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DEPLOY_ROOT: '/var/www/lumipet'
  PRODUCTION_ORIGIN: 'https://lumipet.vn'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/lumi-booking.js
          node --check public/lumi-ui.js
          node --check public/lumi-blog.js
          node --check scripts/unify-static-shell.mjs

      - name: Typecheck and build
        shell: bash
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run lint
          npm run build

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/favicon.svg
          test -f dist/lumi-ui.js
          test -f dist/lumi-blog.js
          test -f dist/lumi-shell.css
          test -f dist/lumi-brand-mark.svg
          test -f dist/bai-viet/index.html
          test -f dist/dat-lich/index.html
          test -f dist/dat-phong/index.html
          grep -R -q '27 Võ Trường Toản' dist/assets
          grep -R -q 'zalo.me/0989979675' dist
          grep -q 'lumi-paw-loader' dist/lumi-ui.js
          grep -q 'Article' dist/bai-viet/spa-cho-binh-thanh-gia-bao-nhieu/index.html
          grep -q 'rel="icon"' dist/index.html
          grep -q "favicon.svg?v=${SHORT_SHA}" dist/index.html
          grep -q "lumi-ui.js?v=${SHORT_SHA}" dist/index.html
          grep -q "name=\"lumi-release\" content=\"${SHORT_SHA}\"" dist/index.html
          grep -q 'https://lumipet.vn/' dist/index.html
          grep -q 'Sitemap: https://lumipet.vn/sitemap.xml' dist/robots.txt
          grep -q '<loc>https://lumipet.vn/' dist/sitemap.xml
          if grep -R -q 'capquangfptminhlh.github.io/mimi' dist; then
            echo 'Legacy GitHub Pages canonical/origin detected in production build.'
            exit 1
          fi

      - name: Verify one canonical header on every static page
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          pages=(
            dist/spa-thu-cung-binh-thanh/index.html
            dist/grooming-cho-meo-binh-thanh/index.html
            dist/khach-san-thu-cung-binh-thanh/index.html
            dist/bang-gia-spa-thu-cung/index.html
            dist/dat-lich/index.html
            dist/dat-phong/index.html
            dist/gioi-thieu/index.html
            dist/lien-he/index.html
            dist/bai-viet/index.html
          )
          for page in "${pages[@]}"; do
            test -f "$page"
            grep -q 'data-lumi-unified-header="true"' "$page"
            grep -q "data-lumi-release=\"${SHORT_SHA}\"" "$page"
            grep -q "lumi-brand-mark.svg?v=${SHORT_SHA}" "$page"
            grep -q "lumi-shell.css?v=${SHORT_SHA}" "$page"
            grep -q "lumi-ui.js?v=${SHORT_SHA}" "$page"
            grep -q "favicon.svg?v=${SHORT_SHA}" "$page"
            grep -q 'name="theme-color" content="#f97316"' "$page"
            grep -q '>Giới thiệu<' "$page"
            grep -q '>Liên hệ<' "$page"
            grep -q '>Kiến thức<' "$page"
            grep -q '>Gọi ngay<' "$page"
            grep -q '>Zalo<' "$page"
            grep -q '>Đặt lịch<' "$page"
            if grep -q 'class="brand-mark"' "$page"; then
              echo "Legacy page-specific logo detected: $page"
              exit 1
            fi
          done

      - name: Add release marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"sha":"%s","built_at":"%s","status":"healthy","ui_cache_busted":true}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.json

      - name: Verify self-hosted VPS runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null
          mkdir -p "${DEPLOY_ROOT}/releases"
          test -w "${DEPLOY_ROOT}/releases"
          echo "Self-hosted runner: $(hostname)"
          echo "Deploy root: ${DEPLOY_ROOT}"

      - name: Install atomic release on VPS
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          PREVIOUS_TARGET="$(readlink -f "${DEPLOY_ROOT}/current" 2>/dev/null || true)"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          rsync -a --delete dist/ "$RELEASE_DIR/"

          test -f "$RELEASE_DIR/index.html"
          test -f "$RELEASE_DIR/favicon.svg"
          test -f "$RELEASE_DIR/release.json"
          grep -Fq "$GITHUB_SHA" "$RELEASE_DIR/release.json"

          ln -sfn "$RELEASE_DIR" "${DEPLOY_ROOT}/current"
          CURRENT_TARGET="$(readlink -f "${DEPLOY_ROOT}/current")"
          test "$CURRENT_TARGET" = "$RELEASE_DIR"

          printf '%s\n' "$PREVIOUS_TARGET" > "${DEPLOY_ROOT}/previous-release.txt"
          echo "Activated release: $CURRENT_TARGET"

      - name: Verify active VPS release
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          test -f "${DEPLOY_ROOT}/current/index.html"
          test -f "${DEPLOY_ROOT}/current/favicon.svg"
          test -f "${DEPLOY_ROOT}/current/release.json"
          grep -Fq "$GITHUB_SHA" "${DEPLOY_ROOT}/current/release.json"
          test -f "${DEPLOY_ROOT}/current/bai-viet/index.html"
          test -f "${DEPLOY_ROOT}/current/dat-lich/index.html"
          HOTEL="${DEPLOY_ROOT}/current/khach-san-thu-cung-binh-thanh/index.html"
          grep -q 'data-lumi-unified-header="true"' "$HOTEL"
          grep -q "data-lumi-release=\"${SHORT_SHA}\"" "$HOTEL"
          grep -q "lumi-shell.css?v=${SHORT_SHA}" "$HOTEL"
          grep -q "lumi-ui.js?v=${SHORT_SHA}" "$HOTEL"

      - name: Verify production after DNS cutover
        if: vars.VPS_LIVE_VERIFY == '1'
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -o "$tmp" -w '%{http_code}' \
            "${PRODUCTION_ORIGIN}/release.json?check=${GITHUB_SHA}")"
          test "$code" = '200'
          grep -Fq "$GITHUB_SHA" "$tmp"
          curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/favicon.svg?v=${SHORT_SHA}" >/dev/null
          curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/bai-viet/?v=${SHORT_SHA}" >/dev/null
          hotel="$(mktemp)"
          curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/khach-san-thu-cung-binh-thanh/?v=${SHORT_SHA}" -o "$hotel"
          grep -q 'data-lumi-unified-header="true"' "$hotel"
          grep -q "data-lumi-release=\"${SHORT_SHA}\"" "$hotel"
          grep -q "lumi-shell.css?v=${SHORT_SHA}" "$hotel"
          grep -q "lumi-ui.js?v=${SHORT_SHA}" "$hotel"

      - name: Keep five newest releases
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "${DEPLOY_ROOT}/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "### Lumi Pet deployed on self-hosted VPS runner" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`$(hostname)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Production path: \`${DEPLOY_ROOT}/current\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Header/logo/menu are unified and fixed-name UI assets are cache-busted by release SHA." >> "$GITHUB_STEP_SUMMARY"
