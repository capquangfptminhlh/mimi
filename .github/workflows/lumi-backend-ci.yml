name: Lumi Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin/**"
      - "assets/api-*.js"
      - "assets/admin.*"
      - "assets/booking-remote.*"
      - "assets/booking.js"
      - "assets/site.js"
      - ".github/workflows/lumi-backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "admin/**"
      - "assets/api-*.js"
      - "assets/admin.*"
      - "assets/booking-remote.*"
      - "assets/booking.js"
      - "assets/site.js"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check backend/src/index.js
          node --check backend/src/validation.js
          node --check assets/api-client.js
          node --check assets/admin.js
          node --check assets/booking-remote.js
          node --check assets/booking.js
          node --check assets/site.js
      - name: Unit tests
        run: node --test backend/test/*.test.mjs
