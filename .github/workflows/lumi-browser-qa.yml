name: Lumi Browser QA

on:
  workflow_run:
    workflows: ["Deploy Lumi Pet to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Static release integrity and security
        run: |
          set -euo pipefail
          for path in \
            index.html \
            spa-thu-cung-binh-thanh/index.html \
            grooming-cho-meo-binh-thanh/index.html \
            pet-hotel-binh-thanh/index.html \
            pet-shop-binh-thanh/index.html \
            bang-gia/index.html \
            dat-lich/index.html \
            lien-he/index.html \
            gioi-thieu/index.html \
            faq/index.html; do
            test -s "$path"
          done
          test "$(grep -o '<url>' sitemap.xml | wc -l | tr -d ' ')" -eq 10
          node --check backend/src/index.js
          node --check backend/src/validation.js
          node --check assets/api-client.js
          node --check assets/admin.js
          node --check assets/lumi-v2.js
          node --check assets/lumi-content.js
          node --test backend/test/*.test.mjs
          if grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='*.csv' '(-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{24,})' .; then
            echo 'Potential secret detected'
            exit 1
          fi
      - name: Install browser QA dependencies
        run: |
          mkdir -p /tmp/lumi-qa
          cd /tmp/lumi-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Run deployed browser QA
        env:
          BASE_URL: https://capquangfptminhlh.github.io/mimi
        run: |
          cat > /tmp/lumi-qa/qa.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          const base = process.env.BASE_URL.replace(/\/$/, '');
          const pages = [
            ['home', '/'],
            ['spa', '/spa-thu-cung-binh-thanh/'],
            ['grooming', '/grooming-cho-meo-binh-thanh/'],
            ['hotel', '/pet-hotel-binh-thanh/'],
            ['shop', '/pet-shop-binh-thanh/'],
            ['price', '/bang-gia/'],
            ['booking', '/dat-lich/'],
            ['contact', '/lien-he/'],
            ['about', '/gioi-thieu/'],
            ['faq', '/faq/']
          ];
          const modes = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }]
          ];
          fs.mkdirSync('qa-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failed = false;

          for (const [mode, viewport] of modes) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            await context.addInitScript(() => {
              window.__lumiPerf = { lcp: 0, cls: 0, interaction: 0 };
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) window.__lumiPerf.lcp = Math.max(window.__lumiPerf.lcp, entry.startTime || 0);
                }).observe({ type: 'largest-contentful-paint', buffered: true });
              } catch {}
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) if (!entry.hadRecentInput) window.__lumiPerf.cls += entry.value || 0;
                }).observe({ type: 'layout-shift', buffered: true });
              } catch {}
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) if (entry.interactionId) window.__lumiPerf.interaction = Math.max(window.__lumiPerf.interaction, entry.duration || 0);
                }).observe({ type: 'event', buffered: true, durationThreshold: 16 });
              } catch {}
            });

            for (const [key, path] of pages) {
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', (err) => errors.push(`pageerror:${err.message}`));
              page.on('console', (msg) => { if (msg.type() === 'error') errors.push(`console:${msg.text()}`); });
              page.on('response', (response) => {
                if (response.url().startsWith(base) && response.status() >= 400) errors.push(`http:${response.status()}:${response.url()}`);
              });

              const response = await page.goto(`${base}${path}`, { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForFunction(() => document.getElementById('app')?.dataset.content === 'loaded', null, { timeout: 15000 });
              await page.waitForTimeout(150);

              const audit = await page.evaluate(() => {
                const canonical = document.querySelector('link[rel="canonical"]')?.href || '';
                const schema = [...document.querySelectorAll('script[type="application/ld+json"]')].map((n) => n.textContent || '');
                const unresolved = document.body.innerHTML.includes("${U('");
                const overflow = document.documentElement.scrollWidth - window.innerWidth;
                const unsafeBlank = [...document.querySelectorAll('a[target="_blank"]')].filter((a) => !(a.rel || '').split(/\s+/).includes('noopener')).length;
                return {
                  title: document.title,
                  description: document.querySelector('meta[name="description"]')?.content || '',
                  canonical,
                  contentLoaded: document.getElementById('app')?.dataset.content === 'loaded',
                  h1Count: document.querySelectorAll('h1').length,
                  h2Count: document.querySelectorAll('h2').length,
                  faqCount: document.querySelectorAll('.long-faq details').length,
                  schemaCount: schema.length,
                  hasBusinessSchema: schema.some((x) => x.includes('PetStore')),
                  unresolved,
                  overflow,
                  unsafeBlank
                };
              });

              if (!response || response.status() >= 400) errors.push(`navigation:${response?.status() || 'NO_RESPONSE'}`);
              if (!audit.contentLoaded) errors.push('content:not-loaded');
              if (!audit.title || !audit.description || !audit.canonical) errors.push('seo:missing-title-description-canonical');
              if (audit.canonical !== `${base}${path}`) errors.push(`seo:canonical-mismatch:${audit.canonical}`);
              if (audit.h1Count !== 1) errors.push(`seo:h1-count:${audit.h1Count}`);
              if (audit.h2Count < 1) errors.push('content:no-h2');
              if (audit.schemaCount < 1 || !audit.hasBusinessSchema) errors.push('seo:schema-missing');
              if (audit.unresolved) errors.push('content:unresolved-link-token');
              if (audit.overflow > 2) errors.push(`responsive:horizontal-overflow:${audit.overflow}`);
              if (audit.unsafeBlank) errors.push(`security:unsafe-target-blank:${audit.unsafeBlank}`);

              const axe = await new AxeBuilder({ page })
                .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'])
                .analyze();
              const severeA11y = axe.violations.filter((v) => ['critical', 'serious'].includes(v.impact));
              if (severeA11y.length) errors.push(`a11y:${severeA11y.map((v) => v.id).join(',')}`);

              await page.screenshot({ path: `qa-artifacts/${key}-${mode}.png`, fullPage: true });

              if (key === 'hotel') {
                const today = new Date();
                const inDate = new Date(today.getTime() + 86400000).toISOString().slice(0, 10);
                const outDate = new Date(today.getTime() + 3 * 86400000).toISOString().slice(0, 10);
                await page.locator('[data-hotel] input[name="checkinDate"]').first().fill(inDate);
                await page.locator('[data-hotel] input[name="checkoutDate"]').first().fill(outDate);
                const nights = await page.locator('[data-hotel] [data-nights]').first().textContent();
                if (!/2 đêm/.test(nights || '')) errors.push(`hotel:nights:${nights}`);
              }
              if (key === 'shop') {
                await page.locator('[data-add]').first().click();
                if (!(await page.locator('#drawer').first().evaluate((el) => el.classList.contains('open')))) errors.push('shop:drawer-not-open');
              }
              const faqSummary = page.locator('.long-faq summary').first();
              if (await faqSummary.count()) await faqSummary.click();
              await page.waitForTimeout(200);

              const perf = await page.evaluate(() => {
                const nav = performance.getEntriesByType('navigation')[0];
                return {
                  lcpMs: Number(window.__lumiPerf?.lcp || 0),
                  cls: Number(window.__lumiPerf?.cls || 0),
                  interactionMs: Number(window.__lumiPerf?.interaction || 0),
                  domContentLoadedMs: Number(nav?.domContentLoadedEventEnd || 0),
                  loadMs: Number(nav?.loadEventEnd || 0)
                };
              });
              if (perf.lcpMs > 2500) errors.push(`performance:lcp:${perf.lcpMs.toFixed(0)}`);
              if (perf.cls > 0.1) errors.push(`performance:cls:${perf.cls.toFixed(3)}`);
              if (perf.interactionMs > 200) errors.push(`performance:interaction:${perf.interactionMs.toFixed(0)}`);

              results.push({
                key,
                path,
                mode,
                audit,
                accessibility: { violations: axe.violations.map((v) => ({ id: v.id, impact: v.impact, nodes: v.nodes.length })) },
                performance: perf,
                errors
              });
              if (errors.length) failed = true;
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('qa-artifacts/browser-qa.json', JSON.stringify({ base, results }, null, 2));
          const compact = results.map((r) => `${r.key}/${r.mode}: ${r.errors.length ? 'FAIL ' + r.errors.join(' | ') : 'PASS'} | LCP ${r.performance.lcpMs.toFixed(0)}ms CLS ${r.performance.cls.toFixed(3)} INT ${r.performance.interactionMs.toFixed(0)}ms`).join('\n');
          fs.writeFileSync('qa-artifacts/browser-qa.txt', compact + '\n');
          console.log(compact);
          if (failed) process.exit(1);
          EOF
          node /tmp/lumi-qa/qa.mjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-browser-qa
          path: qa-artifacts/
          retention-days: 14
