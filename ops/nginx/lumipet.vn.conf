# Lumi Pet owns only lumipet.vn / www.lumipet.vn.
# Keep this vhost isolated from AutoTax and every other site on the same VPS.

server {
    listen 80;
    listen [::]:80;
    server_name lumipet.vn www.lumipet.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://lumipet.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lumipet.vn www.lumipet.vn;

    ssl_certificate /etc/letsencrypt/live/lumipet.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumipet.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LUMIPET_SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/lumipet/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Machine-readable marker used by deploy QA to prove that the request
    # reached Lumi Pet's vhost instead of AutoTax or another default server.
    add_header X-Lumi-Site "lumipet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /release.json {
        add_header Cache-Control "no-store" always;
        add_header X-Lumi-Site "lumipet" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Lumi-Site "lumipet" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
