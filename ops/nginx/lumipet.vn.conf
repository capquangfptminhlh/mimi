# Lumi Pet owns only lumipet.vn / www.lumipet.vn.
# Keep this vhost isolated from AutoTax and every other site on the same VPS.
# Hardened security configuration: HSTS, CSP, Permissions-Policy, COOP, scanner blocking, method allowlist.

# HTTP redirect -> HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name lumipet.vn www.lumipet.vn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://lumipet.vn$request_uri;
    }
}

# HTTPS www redirect -> HTTPS apex (tránh trùng lặp host, tập trung sức mạnh SEO)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lumipet.vn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/lumipet.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumipet.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://lumipet.vn$request_uri;
}

# HTTPS apex - Main Hardened vhost
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lumipet.vn;

    ssl_certificate /etc/letsencrypt/live/lumipet.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumipet.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:LUMIPET_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/lumipet/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    error_page 404 /404.html;

    # Allow only safe HTTP methods (blocks TRACE, PUT, DELETE, PATCH, WebDAV)
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # Machine-readable marker + Full Defense-in-Depth Security Headers
    add_header X-Lumi-Site "lumipet" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://lumipet.vn https://images.pexels.com https://www.google-analytics.com https://www.google.com https://www.google.com.vn https://googleads.g.doubleclick.net; connect-src 'self' https://lumipet.vn https://formsubmit.co https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://www.google.com https://googleads.g.doubleclick.net; frame-src 'self' https://www.google.com https://maps.google.com https://www.googletagmanager.com; form-action 'self' https://formsubmit.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

    # Block dotfiles (.git, .env, .htaccess, etc.) and automated exploit scanners cold
    location ~ /\. {
        deny all;
        return 444;
    }

    location ~* \.(?:php|phtml|phar|asp|aspx|jsp|cgi|sql|bak|old|orig|save|swp|env|ini|log|sh)$ {
        return 444;
    }

    location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc|cgi-bin|phpmyadmin|pma|adminer|vendor|node_modules|scripts|ops|package\.json|package-lock\.json|vite\.config|tsconfig\.json) {
        return 444;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # API Proxy tới microservice nội bộ (bảo mật token Zalo bot, chống spam)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }

    location = /release.json {
        add_header Cache-Control "no-store" always;
        add_header X-Lumi-Site "lumipet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Lumi-Site "lumipet" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Lumi-Site "lumipet" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # IndexNow key verification file (Bing / ChatGPT Search)
    location = /c8f4a2e9b1d7403e9a5c6f2d8b1e4a70.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Lumi-Site "lumipet" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Phase 2 AEO: 301 redirect consolidated scaled weight pages -> main 2026 price hub
    location ~ ^/bai-viet/cho-(?:2|3)kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#cho-duoi-3kg;
    }
    location ~ ^/bai-viet/cho-(?:4|5|6)kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#cho-3-6kg;
    }
    location ~ ^/bai-viet/cho-(?:7|8|9)kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#cho-6-9kg;
    }
    location ~ ^/bai-viet/cho-(?:10|11|12)kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#cho-9-12kg;
    }
    location ~ ^/bai-viet/cho-(?:13|14|15)kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#cho-12-15kg;
    }
    location ~ ^/bai-viet/meo-5kg-di-spa-gia-bao-nhieu/?$ {
        return 301 https://lumipet.vn/bang-gia-spa-thu-cung/#meo-3-6kg;
    }

    location = /favicon.ico {
        try_files /favicon.ico /favicon.svg =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Lumi-Site "lumipet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
